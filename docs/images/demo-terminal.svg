<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Window Frame -->
  <rect x="10" y="10" width="740" height="390" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2" filter="url(#shadow)" />
  <!-- Title Bar -->
  <rect x="10" y="10" width="740" height="42" rx="16" fill="#161b22" />
  <rect x="10" y="36" width="740" height="16" fill="#161b22" />
  <!-- Window Buttons -->
  <circle cx="36" cy="31" r="6.5" fill="#ff5f56" />
  <circle cx="56" cy="31" r="6.5" fill="#ffbd2e" />
  <circle cx="76" cy="31" r="6.5" fill="#27c93f" />
  <!-- Window Title -->
  <text x="380" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="12" font-weight="600" fill="#8b949e" text-anchor="middle">prime-agent — aarch64 Android / Termux</text>

  <!-- Terminal Content -->
  <g font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="13">
    <!-- Command Prompt -->
    <text x="32" y="82" fill="#58a6ff" font-weight="700">~ $</text>
    <text x="64" y="82" fill="#f0f6fc">prime-agent --provider antigravity --model gemini-3.8-flash-high</text>

    <!-- Banner -->
    <text x="32" y="116" fill="#7ee787">✓</text>
    <text x="50" y="116" fill="#8b949e">Loaded Provider:</text>
    <text x="190" y="116" fill="#79c0ff" font-weight="700">Google Antigravity</text>
    <text x="360" y="116" fill="#8b949e">(OAuth 2.0 Token OK)</text>

    <text x="32" y="142" fill="#7ee787">✓</text>
    <text x="50" y="142" fill="#8b949e">Context Window:</text>
    <text x="190" y="142" fill="#d2a8ff" font-weight="700">1,048,576 tokens</text>
    <text x="360" y="142" fill="#8b949e">| Max output: 65,536</text>

    <text x="32" y="168" fill="#7ee787">✓</text>
    <text x="50" y="168" fill="#8b949e">Kernel Venv   :</text>
    <text x="190" y="168" fill="#56d364">Glibc CPython 3.11.17</text>
    <text x="380" y="168" fill="#8b949e">(9 active skills)</text>

    <!-- Divider -->
    <line x1="32" y1="192" x2="728" y2="192" stroke="#21262d" stroke-width="1.5" />

    <!-- User Prompt -->
    <text x="32" y="224" fill="#ffa657" font-weight="700">&gt; Prompt:</text>
    <text x="104" y="224" fill="#f0f6fc">"Use Python REPL to inspect OS machine &amp; compute 1234*5678"</text>

    <!-- Tool Call -->
    <text x="32" y="260" fill="#e3b341">⚙ Tool Execution:</text>
    <text x="180" y="260" fill="#a5d6ff">python_repl(code="import platform; platform.machine(), 1234*5678")</text>

    <!-- Tool Result -->
    <rect x="32" y="280" width="696" height="42" rx="8" fill="#161b22" stroke="#30363d" />
    <text x="48" y="306" fill="#7ee787">Result [8s]:</text>
    <text x="160" y="306" fill="#f0f6fc" font-weight="700">('aarch64', 7006652)</text>

    <!-- Response -->
    <text x="32" y="356" fill="#79c0ff" font-weight="700">◆ Gemini 3.8:</text>
    <text x="156" y="356" fill="#e6edf3">Hasil komputasi adalah</text>
    <text x="330" y="356" fill="#56d364" font-weight="700">7,006,652</text>
    <text x="415" y="356" fill="#e6edf3">pada arsitektur ARM64 Termux.</text>

    <!-- Cursor -->
    <rect x="32" y="378" width="8" height="15" fill="#58a6ff">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>